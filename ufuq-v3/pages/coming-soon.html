<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coming Soon &mdash; Ufuq</title>
<link rel="stylesheet" href="../css/base.css">
<link rel="stylesheet" href="../css/layout.css">
<link rel="stylesheet" href="../css/icons.css">
</head>
<body>

<div id="site-header"></div>

<main>
  <div class="page-content container text-center" style="max-width:560px;">
    <div class="card" style="padding: var(--space-8) var(--space-6);">
      <div class="flex-center" style="margin-bottom:16px;">
        <span class="icon icon-primary" id="comingSoonIcon" style="width:44px;height:44px;"></span>
      </div>
      <h2 id="comingSoonTitle" style="margin-bottom:8px;">Coming Soon</h2>
      <p class="text-muted" style="margin-bottom:24px;">This part of Ufuq is planned for a later sprint.</p>
      <a href="browse.html" class="btn btn-primary">Back to Browse</a>
    </div>
  </div>
</main>

<div id="site-footer"></div>

<script src="../js/store.js"></script>
<script src="../js/constants.js"></script>
<script src="../js/components.js"></script>
<script>
  requireRole(["user"], { base: "" });
  renderHeader({ active: "", base: "../" });
  renderFooter({ base: "../" });

  document.getElementById("comingSoonIcon").outerHTML = iconHtml("goal", { base: "../", sizePx: 44, extraClass: "icon-primary" });

  const params = new URLSearchParams(window.location.search);
  const feature = params.get("feature") || "This Feature";
  document.title = `${feature} — Coming Soon — Ufuq`;
  document.getElementById("comingSoonTitle").textContent = `${feature} — Coming Soon`;
</script>

</body>
</html>
